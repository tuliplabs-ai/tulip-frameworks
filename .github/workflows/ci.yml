name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          python -m pip install --upgrade pip ruff
          ruff check src tests examples
          ruff format --check src tests examples

  typecheck:
    name: typecheck (base env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Typecheck in a BASE env on purpose: the framework packages are optional
      # extras, so they are absent here and `ignore_missing_imports` (see pyproject)
      # types the bridges' lazy imports as Any. tulip-agents>=2 is on PyPI and comes
      # in as a normal dependency of `pip install -e .`.
      - name: Install (core only, no framework extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install mypy
      - name: Mypy
        run: mypy src/tulip_frameworks

  test:
    name: test #${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Install the framework extras so the per-framework bridge tests run for real
      # rather than importorskip-ing. (CrewAI is omitted — its tree is the heaviest
      # and churniest; its bridge test importorskips, and the bridge follows the
      # identical pattern as the others.) tulip-agents>=2 comes from PyPI.
      - name: Install (with framework extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[langchain,langgraph,openai-agents,llama-index,adk]"
          pip install pytest pytest-asyncio pytest-cov
      # The live-LLM integration tests under tests/integration skip automatically
      # without an API key and without the langchain-anthropic extra, so CI
      # exercises the full offline gate without needing any secrets.
      #
      # ≥95% coverage is an org-wide hard gate. crewai is intentionally NOT installed
      # (heaviest/churniest tree); crewai.py is still covered by the fake-module unit
      # test in tests/test_crewai_unit.py, so the gate holds without it.
      - name: Test (coverage-gated ≥95%)
        run: pytest --cov=src/tulip_frameworks --cov-report=term-missing --cov-fail-under=95 tests -q
