name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

# Default to read-only. The publish job declares the id-token scope it needs.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  HATCH_VERSION: "1.16.5"

jobs:
  # Releases are cut from commits that already passed the full `ci.yml`
  # (lint + base-env typecheck + test matrix), so the pipeline starts at build.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pkg-name: ${{ steps.check-version.outputs.pkg-name }}
      version: ${{ steps.check-version.outputs.version }}
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # actions/setup-python@v6.2.0
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Hatch
        run: pip install hatch==${{ env.HATCH_VERSION }}

      - name: Build project for distribution
        run: hatch build

      # actions/upload-artifact@v7.0.1
      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist/

      - name: Check version
        id: check-version
        run: |
          echo "pkg-name=tulip-frameworks" >> "$GITHUB_OUTPUT"
          echo "version=$(hatch version)" >> "$GITHUB_OUTPUT"

  # Install the freshly built wheel and import it, so a broken artifact never
  # reaches PyPI. No framework extras needed — the core import is enough.
  verify:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/setup-python@v6.2.0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # actions/download-artifact@v8.0.1
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/

      - name: Verify the wheel imports
        env:
          PKG_NAME: ${{ needs.build.outputs.pkg-name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          pip install "dist/${PKG_NAME//-/_}-${VERSION}-py3-none-any.whl"
          python -c "import tulip_frameworks as t; print(t.__version__); print(t.__all__)"

  publish:
    needs:
      - build
      - verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC: mint a short-lived token for PyPI Trusted Publishing — no
      # long-lived PYPI_TOKEN secret to leak, expire, or rotate.
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/${{ needs.build.outputs.pkg-name }}
    steps:
      # actions/download-artifact@v8.0.1
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/

      # pypa/gh-action-pypi-publish@v1.14.0 — Trusted Publishing (OIDC).
      # Requires a "pending/trusted publisher" on pypi.org:
      #   PyPI project = tulip-frameworks, owner = tuliplabs-ai,
      #   repository = tulip-frameworks, workflow = _release.yml, environment = pypi
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist/
