[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tulip-frameworks"
version = "0.1.0"
description = "Drop Tulip's control runtime (admit() gate + tamper-evident audit) into the agent framework you already use — LangChain, LangGraph, CrewAI, the OpenAI Agents SDK, LlamaIndex."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Tulip Labs" },
]
keywords = [
    "agents",
    "ai",
    "langchain",
    "langgraph",
    "crewai",
    "llamaindex",
    "openai-agents",
    "adk",
    "llm",
    "guardrails",
    "audit",
    "human-in-the-loop",
    "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed",
]
# One-way dependency: framework bridges depend on the core SDK, never the reverse
# (the langchain-community -> langchain-core relationship). The framework trees
# themselves are heavy and churny, so they live behind per-framework extras and
# are imported lazily — `import tulip_frameworks` pulls in none of them.
dependencies = [
    "tulip-agents>=2.0",
]

[project.optional-dependencies]
# One extra per framework. The bridge code is thin; the extra just pins the
# upstream package its module imports lazily.
langchain = ["langchain-core>=0.3"]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
crewai = ["crewai>=0.80"]
openai-agents = ["openai-agents>=0.0.1"]
llama-index = ["llama-index-core>=0.11"]
adk = ["google-adk>=0.2"]
# Convenience meta-extra: every framework bridge.
all = [
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "crewai>=0.80",
    "openai-agents>=0.0.1",
    "llama-index-core>=0.11",
    "google-adk>=0.2",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=6.0", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://tulipagents.ai/"
Core = "https://github.com/tuliplabs-ai/sdk-python"
Documentation = "https://tulipagents.ai/integrations/frameworks/"

[tool.hatch.build.targets.wheel]
packages = ["src/tulip_frameworks"]

[tool.hatch.envs.default]
# The dev tooling PLUS every framework extra except crewai, so `test-cov` measures the
# per-framework bridges against their REAL upstream tool classes. (crewai's tree is the
# heaviest and churniest — CI omits it too; crewai.py is covered by a fake-module unit
# test in tests/test_crewai_unit.py.) mypy stays clean whether or not these are present:
# the framework modules are `follow_imports = "skip"` (see [tool.mypy] overrides).
features = ["langchain", "langgraph", "openai-agents", "llama-index", "adk", "dev"]
# tulip-agents is a normal PyPI dependency, but for local co-development we override it
# with an editable install of the sibling checkout.
post-install-commands = ["python -m pip install -e {root}/../tulip-agents"]

[tool.hatch.envs.default.scripts]
# Mirror the core repo's hatch ergonomics.
sdk = "python -m pip install -e {env:TULIP_SDK_DIR:../tulip-agents}"
test = "pytest {args:tests}"
# test-cov enforces ≥95% coverage (fail_under in [tool.coverage.report]).
test-cov = "pytest --cov=src/tulip_frameworks --cov-report=term-missing {args:tests}"
lint = "ruff check src tests examples"
lint-fix = "ruff check --fix src tests examples"
format = "ruff format src tests examples"
format-check = "ruff format --check src tests examples"
typecheck = "mypy src/tulip_frameworks"
# The CI gate — a clean `hatch run check` is what the pipeline enforces.
check = ["format-check", "lint", "typecheck", "test-cov"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is the formatter's job (mirrors core)

[tool.mypy]
python_version = "3.11"
strict = true

# The framework bridges import their framework lazily and are typed against it, but
# the framework packages are optional extras. `follow_imports = "skip"` makes mypy
# treat them as `Any` whether or not they're installed, so the strict typecheck is
# identical in a base env (CI's typecheck job) and in the test env where the extras
# are present for coverage — the bridge contract is what's tested, not the upstream
# packages' stubs (mirrors the tulip-registry psycopg/jwt pattern).
[[tool.mypy.overrides]]
module = [
    "langchain_core.*",
    "langgraph.*",
    "agents.*",
    "crewai.*",
    "llama_index.*",
    "google.adk.*",
]
follow_imports = "skip"
ignore_missing_imports = true

# =============================================================================
# Coverage — the ≥95% org-wide gate (enforced by test-cov / CI's --cov-fail-under)
# =============================================================================
[tool.coverage.run]
source = ["src/tulip_frameworks"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "class .*\\bProtocol\\):",
    "@overload",
    "if __name__ == .__main__.:",
]
fail_under = 95
show_missing = true
